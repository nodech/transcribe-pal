name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  BIN: transcribe-pal

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: wayland
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_ext: ""
            features: "--features wayland"
            archive: tar.gz
          - name: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_ext: ""
            features: ""
            archive: tar.gz
          - name: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_ext: ".exe"
            features: ""
            archive: zip
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bin_ext: ""
            features: ""
            archive: tar.gz

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
        shell: bash

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libssl-dev pkg-config

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }} ${{ matrix.features }}

      - name: Package
        id: package
        shell: bash
        run: |
          name="${BIN}-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/${BIN}${{ matrix.bin_ext }}" "$name/"

          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$name.zip" "$name"
            echo "asset=$name.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "$name.tar.gz" "$name"
            echo "asset=$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.asset }}
