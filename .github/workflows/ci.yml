name: CI

on: push

permissions:
  contents: read

env:
  ORT_CACHE_DIR: ${{ github.workspace }}/.ort-cache

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustup target add x86_64-unknown-linux-gnu

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libssl-dev pkg-config

      - name: Cache ONNX Runtime
        uses: actions/cache@v4
        with:
          path: .ort-cache
          key: ort-x86_64-unknown-linux-gnu-${{ hashFiles('Cargo.lock') }}

      - name: Format
        run: cargo fmt --all --check

      - name: Check
        run: cargo check --locked --all-targets --target x86_64-unknown-linux-gnu

      - name: Lint
        run: cargo clippy --locked --all-targets --target x86_64-unknown-linux-gnu -- -D warnings

      - name: Build Linux
        run: cargo build --locked --target x86_64-unknown-linux-gnu
